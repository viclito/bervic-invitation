<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="100%" height="100%">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="65%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Ring -->
  <ellipse cx="48" cy="30" rx="22" ry="16" fill="none" stroke="url(#silverGrad)" stroke-width="4.5" transform="rotate(-15 48 30)" filter="url(#ringShadow)" />
  <ellipse cx="48" cy="30" rx="22" ry="16" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="8,24" transform="rotate(-15 48 30)" opacity="0.8" />

  <!-- Right Ring (Interlocked) -->
  <ellipse cx="72" cy="30" rx="22" ry="16" fill="none" stroke="url(#silverGrad)" stroke-width="4.5" transform="rotate(15 72 30)" filter="url(#ringShadow)" />
  <ellipse cx="72" cy="30" rx="22" ry="16" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="10,22" transform="rotate(15 72 30)" opacity="0.8" />
</svg>
