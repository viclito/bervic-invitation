<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE" />
      <stop offset="40%" stop-color="#D9A441" />
      <stop offset="80%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8C6316" />
    </linearGradient>

    <linearGradient id="envelopeNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192A4A" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>

    <linearGradient id="blushFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FADCD5" />
      <stop offset="100%" stop-color="#E8A598" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0E1726" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ── 1. GOLDEN FOLIAGE BEHIND ENVELOPE ── -->
  <g id="foliage" opacity="0.95">
    <!-- Right Golden Sprig -->
    <path d="M 215 90 Q 235 65 240 45" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 225 78 Q 240 70 246 60 Q 235 66 226 73" fill="url(#goldGrad)" />
    <path d="M 233 65 Q 248 55 252 42 Q 242 50 234 60" fill="url(#goldGrad)" />
    <path d="M 238 50 Q 248 36 244 26 Q 238 38 236 47" fill="url(#goldGrad)" />
    <path d="M 218 84 Q 210 74 205 60 Q 212 70 219 79" fill="url(#goldGrad)" />
    
    <!-- Left Subtle Sprig -->
    <path d="M 105 90 Q 85 70 80 52" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 95 80 Q 80 74 74 65 Q 85 71 94 76" fill="url(#goldGrad)" />
    <path d="M 87 68 Q 74 58 72 46 Q 80 55 86 64" fill="url(#goldGrad)" />
  </g>

  <!-- ── 2. OPEN ENVELOPE FLAP (Blush Coral) ── -->
  <polygon points="90,95 160,35 230,95" fill="url(#blushFlap)" stroke="#DDA89B" stroke-width="1.2" />

  <!-- ── 3. INVITATION CARD POPPING OUT ── -->
  <g filter="url(#softGlow)">
    <rect x="110" y="50" width="100" height="90" rx="8" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Inner Delicate Card Border -->
    <rect x="115" y="55" width="90" height="80" rx="5" fill="none" stroke="#EAD7B0" stroke-width="1" stroke-dasharray="3,2" />
    
    <!-- Monogram Initial 'B' -->
    <text x="160" y="105" font-family="'Great Vibes', 'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" font-style="italic" fill="url(#goldGrad)" text-anchor="middle">B</text>
    
    <!-- Card Small Filigree Flourish -->
    <path d="M 145 118 Q 160 114 175 118 M 160 115 L 160 120" stroke="url(#goldGrad)" stroke-width="1" fill="none" stroke-linecap="round" />
  </g>

  <!-- ── 4. NAVY ENVELOPE FRONT BODY ── -->
  <g filter="url(#softGlow)">
    <!-- Envelope Base Rectangle -->
    <rect x="90" y="95" width="140" height="80" rx="4" fill="url(#envelopeNavy)" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Envelope Front Triangles (V-Fold) -->
    <!-- Left & Right Inward Folds -->
    <polygon points="90,95 160,145 90,175" fill="#14213B" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6" />
    <polygon points="230,95 160,145 230,175" fill="#14213B" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6" />
    
    <!-- Bottom Upward Flap -->
    <polygon points="90,175 160,128 230,175" fill="url(#envelopeNavy)" stroke="url(#goldGrad)" stroke-width="1.8" />
  </g>

  <!-- ── 5. BRAND WORDMARK 'bervic' ── -->
  <g id="brand-text">
    <text x="160" y="235" font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', 'Times New Roman', serif" font-size="54" font-weight="700" fill="#122038" text-anchor="middle" letter-spacing="3">
      bervic
    </text>

    <!-- Golden Leaf Flourish on letter 'b' -->
    <g transform="translate(73, 202)">
      <path d="M 12 18 Q 2 12 0 4 Q 8 6 12 14" fill="url(#goldGrad)" />
      <path d="M 14 10 Q 8 2 15 -4 Q 18 4 14 10" fill="url(#goldGrad)" />
    </g>

    <!-- Coral Heart Dot on letter 'i' -->
    <path d="M 233 194 C 233 191 230 189 227 191 C 224 189 221 191 221 194 C 221 198 227 202 227 202 C 227 202 233 198 233 194 Z" fill="#E89A88" transform="translate(0, -2)" />
  </g>

  <!-- ── 6. DIVIDER LINE WITH DIAMOND ── -->
  <g transform="translate(0, 252)">
    <line x1="50" y1="0" x2="145" y2="0" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Center Diamond & Accents -->
    <polygon points="160,-4 164,0 160,4 156,0" fill="url(#goldGrad)" />
    <circle cx="150" cy="0" r="1.5" fill="url(#goldGrad)" />
    <circle cx="170" cy="0" r="1.5" fill="url(#goldGrad)" />
    
    <line x1="175" y1="0" x2="270" y2="0" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- ── 7. BRAND TAGLINE ── -->
  <text x="160" y="272" font-family="'Outfit', 'Montserrat', sans-serif" font-size="10.5" font-weight="600" fill="#755E38" text-anchor="middle" letter-spacing="4">
    INVITATIONS THAT CREATE MEMORIES
  </text>
</svg>
